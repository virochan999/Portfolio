name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders only: the build never connects to the database.
      POSTGRES_PRISMA_URL: postgresql://user:pass@localhost:5432/db
      POSTGRES_URL_NON_POOLING: postgresql://user:pass@localhost:5432/db
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
